name: sky_core
description: Monorepo for Sky Core architecture and design system.
publish_to: none

environment:
  sdk: '^3.12.0'
  flutter: '>=3.44.0'

dev_dependencies:
  melos: ^7.7.0

workspace:
  - packages/*
  - apps/*

melos:
  scripts:
    analyze:
      run: melos exec -- "dart analyze"
      description: Run dart analyze in all packages.
    release:
      run: melos version --yes && git push --follow-tags && melos publish --no-dry-run --yes
      description: Version, push tags, and publish packages sequentially.
