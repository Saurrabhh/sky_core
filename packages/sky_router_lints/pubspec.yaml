name: sky_router_lints
description: Custom static analysis lints for the sky_router package, helping enforce RouteHandler usage.
version: 1.0.0
repository: https://github.com/Saurrabhh/sky_core/tree/master/packages/sky_router_lints
resolution: workspace

environment:
  sdk: '^3.12.0'
  flutter: '>=3.44.0'

dependencies:
  analysis_server_plugin: ^0.3.14
  analyzer: '>=6.0.0 <13.0.0'

plugin:
  platforms:
    dart:
      pluginClass: SkyRouterLintsPlugin
      fileName: sky_router_lints.dart
